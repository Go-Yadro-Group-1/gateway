version: v1
managed:
  enabled: true
  go_package_prefix:
    default: github.com/Go-Yadro-Group-1/gateway/gen/grpc
    except:
      - buf.build/googleapis/googleapis
plugins:
  - name: go
    out: ../../gen/grpc
    opt: paths=source_relative
  - name: go-grpc
    out: ../../gen/grpc
    opt: paths=source_relative
