jira:
  baseUrl: "https://jira.mariadb.org"
  token: ""
  maxResults: 50
  minRetryDelay: 1000
  maxRetryDelay: 60000
  rateLimitPerSec: 10.0

db:
  host: "postgres"
  port: 5432
  user: "pguser"
  password: "pgpassword"
  dbname: "jira_tracker"

app:
  logLevel: "info"

# Connector has no Prometheus metrics; pprof is its only diagnostic endpoint.
pprof:
  enabled: true
  addr: ":6060"
