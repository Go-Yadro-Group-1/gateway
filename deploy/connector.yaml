# Secrets (jira.token, db.user, db.password) are injected from the environment /
# .env (JIRA_TOKEN, DB_USER, DB_PASSWORD) and intentionally omitted here.
# See root .env.example.
jira:
  baseUrl: "https://jira.mariadb.org"
  maxResults: 50
  minRetryDelay: 1000
  maxRetryDelay: 60000
  rateLimitPerSec: 10.0

db:
  host: "postgres"
  port: 5432
  dbname: "jira_tracker"

app:
  logLevel: "info"

# Diagnostic endpoints: Prometheus metrics (/metrics) and net/http/pprof.
metrics:
  enabled: true
  addr: ":9090"

pprof:
  enabled: true
  addr: ":6060"
